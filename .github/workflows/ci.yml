name: ci

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install rasterio numpy scipy pytest
      - name: Unit tests
        run: python -m pytest tests/ -q
        env:
          PYTHONPATH: src
      - name: Site builds without a run card
        run: python scripts/make_site.py
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  pages:
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
